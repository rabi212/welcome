name: Deploy Application to GKE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: billmonitor
      GAR_LOCATION: asia-south1
      REPOSITORY: docker-repo
      IMAGE: welcome-app
      CLUSTER_NAME: welcome-cluster
      CLUSTER_ZONE: asia-south1-a

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            -f welcome-app/Dockerfile \
            -t asia-south1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            welcome-app

      - name: Push Docker Image
        run: |
          docker push asia-south1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: welcome-cluster
          location: asia-south1-a
          project_id: billmonitor

      - name: Verify Cluster
        run: |
          kubectl get nodes

      - name: Update Deployment Image
        run: |
          IMAGE="asia-south1-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}"
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/welcome-app --timeout=300s

      - name: Kubernetes Debug Information
        if: always()
        run: |
          echo "================== NODES =================="
          kubectl get nodes

          echo "================ DEPLOYMENTS =============="
          kubectl get deployments

          echo "================ REPLICASETS =============="
          kubectl get rs

          echo "=================== PODS =================="
          kubectl get pods -o wide

          echo "================== SERVICES ==============="
          kubectl get svc

          echo "=================== EVENTS ================"
          kubectl get events --sort-by=.metadata.creationTimestamp

          echo "============= DESCRIBE DEPLOYMENT ========="
          kubectl describe deployment welcome-app

          echo "================ DESCRIBE PODS ============"
          kubectl describe pods

          echo "=================== LOGS =================="
          kubectl logs -l app=welcome-app --all-containers=true --tail=100 || true

      - name: Show External IP
        if: always()
        run: |
          kubectl get svc
