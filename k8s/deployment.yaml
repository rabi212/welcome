apiVersion: apps/v1
kind: Deployment

metadata:
  name: welcome-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: welcome-app

  template:
    metadata:
      labels:
        app: welcome-app

    spec:
      containers:
      - name: welcome-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
