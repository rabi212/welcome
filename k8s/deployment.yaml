apiVersion: apps/v1
kind: Deployment

metadata:
  name: welcome-app
  labels:
    app: welcome-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: welcome-app

  template:
    metadata:
      labels:
        app: welcome-app

    spec:
      containers:
        - name: welcome-app
          image: IMAGE_PLACEHOLDER

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
