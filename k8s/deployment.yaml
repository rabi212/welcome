apiVersion: apps/v1
kind: Deployment

metadata:
  name: welcome-app
  labels:
    app: welcome-app

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: welcome-app

  template:
    metadata:
      labels:
        app: welcome-app

    spec:
      containers:
        - name: welcome-app

          image: IMAGE_PLACEHOLDER

          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"

            limits:
              cpu: "100m"
              memory: "64Mi"
